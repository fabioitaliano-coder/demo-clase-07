<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Mi Aplicación</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-2xl font-bold">Dashboard - Sistema de Gestión</h1>
                <button 
                    id="logout-button" 
                    class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition duration-200"
                >
                    Cerrar Sesión
                </button>
            </div>
            <!-- Navigation Menu -->
            <nav class="flex space-x-4">
                <a href="/dashboard.html" class="px-3 py-2 rounded-md text-sm font-medium bg-blue-700 text-white">Dashboard</a>
                <a href="/materias.html" class="px-3 py-2 rounded-md text-sm font-medium text-blue-100 hover:bg-blue-700 hover:text-white transition duration-150">Materias</a>
            </nav>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container mx-auto p-6">
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">Mis Datos</h2>
            
            <!-- Formulario para crear/editar ítems -->
            <div class="mb-4">
                <form id="item-form" class="grid grid-cols-1 md:grid-cols-3 gap-3 items-end">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nombre</label>
                        <input id="item-nombre" type="text" class="mt-1 block w-full rounded border-gray-300 p-2" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Descripción</label>
                        <input id="item-descripcion" type="text" class="mt-1 block w-full rounded border-gray-300 p-2" />
                    </div>
                    <div>
                        <input type="hidden" id="item-id" />
                        <button id="item-save" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Guardar</button>
                        <button id="item-cancel" type="button" class="ml-2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">Cancelar</button>
                    </div>
                </form>
            </div>

            <!-- Contenedor de datos dinámicos -->
            <div id="lista-de-datos" class="text-gray-600">
                <p class="text-center text-gray-400">Cargando datos...</p>
            </div>
        </div>
    </main>

    <script src="/js/dashboard.js"></script>
</body>
</html>
