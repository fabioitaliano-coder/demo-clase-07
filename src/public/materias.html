<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materias - Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <header class="bg-blue-600 text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Materias - Demo</h1>
      <button id="logout-button" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Cerrar Sesión</button>
    </div>
  </header>

  <main class="container mx-auto p-6">
    <div class="bg-white p-6 rounded-lg shadow-md">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-semibold text-gray-800">Gestión de Materias</h2>
        <button id="btn-nueva-materia" type="button" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded inline-flex items-center">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          Agregar Nueva Materia
        </button>
      </div>

      <!-- Formulario crear/editar (inicialmente oculto) -->
      <form id="materia-form" class="hidden grid grid-cols-1 md:grid-cols-3 gap-3 items-end mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Nombre</label>
          <input id="materia-nombre" type="text" class="mt-1 block w-full rounded border-gray-300 p-2" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Descripción</label>
          <input id="materia-descripcion" type="text" class="mt-1 block w-full rounded border-gray-300 p-2" />
        </div>
        <div>
          <input id="materia-id" type="hidden" />
          <button id="materia-save" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Guardar</button>
          <button id="materia-cancel" type="button" class="ml-2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">Cancelar</button>
        </div>
      </form>

      <!-- Contenedor para lista de materias -->
      <div id="materias-container" class="text-gray-600">
        <p class="text-center text-gray-400">Cargando materias...</p>
      </div>

    </div>
  </main>

  <script src="/js/materias.js"></script>
</body>
</html>
